<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Shadow Ronin</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a12;color:#fff;font-family:system-ui,Arial;touch-action:none}canvas{width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:14px}.card{background:#0b1020cc;border:1px solid #ffffff1c;border-radius:14px;padding:9px 12px;backdrop-filter:blur(8px)}.title{font-weight:900;letter-spacing:3px}.small{font-size:11px;color:#aeb7cf}.bar{width:180px;height:9px;background:#252b3c;border-radius:9px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff315d,#ff9b4d)}#menu{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#05081266}#menu h1{font-size:clamp(38px,9vw,82px);letter-spacing:9px;margin:0 0 8px}button{border:0;border-radius:12px;background:#ff3d62;color:#fff;font-weight:900;padding:14px 24px;font-size:16px;box-shadow:0 10px 35px #ff3d6244}#controls{position:fixed;inset:0;pointer-events:none}.pad{position:absolute;left:16px;bottom:16px;width:174px;height:174px}.actions{position:absolute;right:18px;bottom:24px;display:flex;gap:12px}.b{pointer-events:auto;width:58px;height:58px;border-radius:18px;border:1px solid #fff2;background:#11182bcc;color:white;display:grid;place-items:center;font-weight:900;font-size:21px;user-select:none}.up{position:absolute;left:58px;top:0}.down{position:absolute;left:58px;bottom:0}.left{position:absolute;left:0;top:58px}.right{position:absolute;right:0;top:58px}.actions .b{width:72px;height:72px;border-radius:50%}.attack{background:#ff315d99}.dash{background:#5865f299}@media(max-height:500px){.pad{transform:scale(.8);transform-origin:bottom left;bottom:10px}.actions{transform:scale(.8);transform-origin:bottom right;bottom:10px;right:8px}}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="top"><div class="card"><div class="title">SHADOW RONIN</div><div class="small">DEFEAT THE HUNTERS</div><div class="bar"><i id="hp"></i></div></div><div class="card" id="score">SCORE 0000</div></div></div><div id="menu"><div><h1 id="mt">SHADOW RONIN</h1><p id="mp">Move • Slash • Dash • Survive</p><button id="start">START GAME</button></div></div><div id="controls"><div class="pad"><div class="b up" data-k="up">▲</div><div class="b down" data-k="down">▼</div><div class="b left" data-k="left">◀</div><div class="b right" data-k="right">▶</div></div><div class="actions"><div class="b dash" data-k="dash">⚡</div><div class="b attack" data-k="attack">⚔</div></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,last=0,run=0,score=0,spawn=0,en=[],pt=[],sw=[];const k={up:0,down:0,left:0,right:0};const p={x:0,y:0,vx:0,vy:0,a:0,hp:100,atk:0,dash:0,inv:0};function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();
function start(){p.x=W/2;p.y=H/2;p.vx=p.vy=0;p.hp=100;p.atk=p.dash=p.inv=0;en=[];pt=[];sw=[];score=0;spawn=.2;run=1;document.getElementById('menu').style.display='none'}function foe(){let s=(Math.random()*4)|0,q=s<2?Math.random()*W:(s===2?-30:W+30),r=s<2?(s?-30:H+30):Math.random()*H;en.push({x:q,y:r,hp:2,sp:50+Math.random()*35,r:17,a:0})}function burst(a,b,n=10){for(let i=0;i<n;i++){let q=Math.random()*6.283,v=50+Math.random()*180;pt.push({x:a,y:b,vx:Math.cos(q)*v,vy:Math.sin(q)*v,l:.35+Math.random()*.35})}}function attack(){if(!run||p.atk>0)return;p.atk=.25;sw.push({x:p.x,y:p.y,a:p.a,l:.22});burst(p.x+Math.cos(p.a)*40,p.y+Math.sin(p.a)*40,7);en=en.filter(e=>{let dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy),q=Math.atan2(dy,dx),df=Math.atan2(Math.sin(q-p.a),Math.cos(q-p.a));if(d<92&&Math.abs(df)<1.05){e.hp--;if(e.hp<=0){score+=100;burst(e.x,e.y,18);return false}}return true})}function dash(){if(!run||p.dash>0)return;p.dash=.7;p.inv=.25;p.vx=Math.cos(p.a)*650;p.vy=Math.sin(p.a)*650;burst(p.x,p.y,12)}
function upd(dt){let ax=(k.right?1:0)-(k.left?1:0),ay=(k.down?1:0)-(k.up?1:0);if(ax||ay){let l=Math.hypot(ax,ay);ax/=l;ay/=l;p.a=Math.atan2(ay,ax)}if(p.dash<=0){p.vx+=ax*1100*dt;p.vy+=ay*1100*dt;let s=Math.hypot(p.vx,p.vy);if(s>260){p.vx*=260/s;p.vy*=260/s}}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.001,dt);p.vy*=Math.pow(.001,dt);p.x=Math.max(25,Math.min(W-25,p.x));p.y=Math.max(25,Math.min(H-25,p.y));p.atk=Math.max(0,p.atk-dt);p.dash=Math.max(0,p.dash-dt);p.inv=Math.max(0,p.inv-dt);spawn-=dt;if(spawn<=0){foe();spawn=Math.max(.25,1-score/6000)}for(let e of en){let a=Math.atan2(p.y-e.y,p.x-e.x);e.a=a;e.x+=Math.cos(a)*e.sp*dt;e.y+=Math.sin(a)*e.sp*dt;if(Math.hypot(e.x-p.x,e.y-p.y)<29&&p.inv<=0){p.hp-=20;p.inv=.6;burst(p.x,p.y,10);if(p.hp<=0){run=0;document.getElementById('menu').style.display='grid';document.getElementById('mt').textContent='YOU FELL';document.getElementById('mp').textContent='Score: '+score;document.getElementById('start').textContent='PLAY AGAIN'}}}for(let z of pt){z.x+=z.vx*dt;z.y+=z.vy*dt;z.vx*=.96;z.vy*=.96;z.l-=dt}pt=pt.filter(z=>z.l>0);for(let z of sw)z.l-=dt;sw=sw.filter(z=>z.l>0);document.getElementById('hp').style.width=Math.max(0,p.hp)+'%';document.getElementById('score').textContent='SCORE '+String(score).padStart(4,'0')}
function draw(){x.clearRect(0,0,W,H);let g=x.createRadialGradient(W*.5,H*.45,10,W*.5,H*.5,Math.max(W,H)*.8);g.addColorStop(0,'#1a2440');g.addColorStop(1,'#05070e');x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle='#ffffff0b';for(let i=-50;i<W+60;i+=55){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=-50;i<H+60;i+=55){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}for(let e of en){x.save();x.translate(e.x,e.y);x.rotate(e.a);x.fillStyle='#0008';x.beginPath();x.ellipse(0,20,24,8,0,0,7);x.fill();x.fillStyle='#202638';x.beginPath();x.arc(0,0,e.r,0,7);x.fill();x.fillStyle='#c93351';x.fillRect(4,-6,11,3);x.fillStyle='#151a28';x.beginPath();x.moveTo(-8,-12);x.lineTo(-27,-25);x.lineTo(-18,-4);x.fill();x.strokeStyle='#dfe7f5';x.lineWidth=4;x.beginPath();x.moveTo(7,4);x.lineTo(31,-15);x.stroke();x.restore()}x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=p.inv>.01?.5:1;x.fillStyle='#0008';x.beginPath();x.ellipse(0,22,25,8,0,0,7);x.fill();x.fillStyle='#111725';x.beginPath();x.moveTo(-14,-15);x.quadraticCurveTo(0,-29,15,-15);x.lineTo(13,13);x.quadraticCurveTo(0,25,-13,13);x.fill();x.fillStyle='#e8edf7';x.fillRect(6,-7,10,3);x.fillRect(6,1,10,3);x.fillStyle='#252d45';x.beginPath();x.moveTo(-14,-12);x.lineTo(-42,-27);x.lineTo(-25,-3);x.fill();x.strokeStyle='#f1f4fa';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(10,3);x.lineTo(50,-18);x.stroke();x.strokeStyle='#c4a566';x.lineWidth=4;x.beginPath();x.moveTo(3,5);x.lineTo(14,10);x.stroke();x.restore();for(let s of sw){x.save();x.translate(s.x,s.y);x.rotate(s.a);x.globalAlpha=s.l/.22;x.strokeStyle='#fff';x.lineWidth=9;x.lineCap='round';x.beginPath();x.arc(0,0,67,-.9,.9);x.stroke();x.restore()}for(let z of pt){x.globalAlpha=Math.max(0,z.l/.7);x.fillStyle='#ff4567';x.fillRect(z.x-2,z.y-2,4,4)}x.globalAlpha=1}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(run)upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);document.getElementById('start').onclick=start;addEventListener('keydown',e=>{let a=e.key.toLowerCase();if(a==='w'||a==='arrowup')k.up=1;if(a==='s'||a==='arrowdown')k.down=1;if(a==='a'||a==='arrowleft')k.left=1;if(a==='d'||a==='arrowright')k.right=1;if(a===' ')attack();if(a==='shift')dash()});addEventListener('keyup',e=>{let a=e.key.toLowerCase();if(a==='w'||a==='arrowup')k.up=0;if(a==='s'||a==='arrowdown')k.down=0;if(a==='a'||a==='arrowleft')k.left=0;if(a==='d'||a==='arrowright')k.right=0});document.querySelectorAll('.b').forEach(b=>{let a=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();a==='attack'?attack():a==='dash'?dash():k[a]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();if(a!=='attack'&&a!=='dash')k[a]=0}});
</script></body></html>
